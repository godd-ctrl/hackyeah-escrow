[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

# One program. The ID here must match `declare_id!` in programs/escrow/src/lib.rs.
[programs.localnet]
escrow = "GPmJtpLs7u7BCfUHjRyaffjPSKuJjEjLY1qztzgtVgpC"

[programs.devnet]
escrow = "GPmJtpLs7u7BCfUHjRyaffjPSKuJjEjLY1qztzgtVgpC"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
# Solana Playground uses this path; a local install usually uses ~/.config/solana/id.json
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
